name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential g++ qmake6 \
            qt6-base-dev qt6-declarative-dev qt6-pdf-dev qt6-tools-dev \
            libqt6pdf6 libqt6pdfquick6 \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-pdf qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build
        working-directory: rust
        env:
          QMAKE: /usr/bin/qmake6
          QT_VERSION_MAJOR: "6"
          CXX: g++
          CC: gcc
          RUSTFLAGS: "-C linker=g++"
        run: cargo build --release

      - name: Smoke (Xvfb)
        working-directory: rust
        env:
          QMAKE: /usr/bin/qmake6
          QT_VERSION_MAJOR: "6"
          CXX: g++
          DISPLAY: ":99"
          XDG_RUNTIME_DIR: /tmp/runtime-ci
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          timeout 8 ./target/release/pdfpc --windowed ../demo/pdfpc-demo.pdf
