name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Target Kubuntu/Ubuntu 26.04: shlib Depends must use that release's
    # library package names (no Ubuntu 24.04 t64 names for Qt libs).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Show runner OS
        run: |
          . /etc/os-release
          echo "PRETTY_NAME=$PRETTY_NAME"
          echo "VERSION_ID=$VERSION_ID"

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential g++ qmake6 fakeroot dpkg-dev \
            qt6-base-dev qt6-declarative-dev qt6-pdf-dev qt6-tools-dev \
            libqt6pdf6 libqt6pdfquick6 \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-pdf qml6-module-qtqml \
            qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build
        working-directory: rust
        env:
          QMAKE: /usr/bin/qmake6
          QT_VERSION_MAJOR: "6"
          CXX: g++
          CC: gcc
          RUSTFLAGS: "-C linker=g++"
        run: cargo build --release

      - name: Laser trail continuity tests
        env:
          QMAKE: /usr/bin/qmake6
          QT_VERSION_MAJOR: "6"
          CXX: g++
          CC: gcc
          RUSTFLAGS: "-C linker=g++"
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
        run: scripts/test-laser-trail-continuity.sh

      - name: Window placer command tests
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
        run: scripts/test-window-placer.sh

      - name: Smoke (Xvfb)
        working-directory: rust
        env:
          QMAKE: /usr/bin/qmake6
          QT_VERSION_MAJOR: "6"
          CXX: g++
          DISPLAY: ":99"
          XDG_RUNTIME_DIR: /tmp/runtime-ci
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          # pdfpc-qt6 is a long-running GUI; a clean timeout (124) means it stayed up.
          set +e
          timeout 8 ./target/release/pdfpc-qt6 --windowed ../demo/pdfpc-demo.pdf
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Smoke OK: pdfpc-qt6 still running when timeout fired"
            exit 0
          fi
          echo "Smoke failed: pdfpc-qt6 exited with status $status before timeout"
          exit "$status"

      - name: Package .deb
        run: packaging/build-deb.sh dist

      - name: Show .deb Depends
        run: |
          deb="$(ls dist/pdfpc-qt6_*.deb)"
          echo "DEB=$deb"
          echo -n "Depends: "
          dpkg-deb -f "$deb" Depends
          # Fail the job if Ubuntu 24.04-style Qt t64 deps leaked in (except
          # packages that still use the t64 name on 26.04, e.g. libqt6core6t64).
          deps="$(dpkg-deb -f "$deb" Depends)"
          if echo "$deps" | grep -E 'libqt6(gui|dbus)6t64'; then
            echo "error: Depends still contain 24.04-only Qt t64 names: $deps" >&2
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfpc-qt6_${{ github.sha }}_amd64
          path: dist/*.deb
