[package]
name = "pdfpc"
# Cargo requires semver X.Y.Z; the project version string is in ../VERSION (1.09 → 1.0.9).
version = "1.0.9"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Slim dual-monitor PDF presenter (Qt 6 / QML)"
authors = ["pdfpc_qt6 contributors"]

[[bin]]
name = "pdfpc-qt6"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
